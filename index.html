}}
:root[data-theme="dark"]{
  --bg:#0C110E; --surface:#161D19; --elevated:#1D2621; --sep:#2A332E;
  --ink:#EEF2EF; --ink2:#9DA8A1; --ink3:#75807A;
  --brand:#7FC79E; --brand-ink:#7FC79E; --on-brand:#0C110E; --on-brand2:#9DA8A1; --brand-tint:#173A2C;

}
/* the Now card keeps forest + white in light, tint in dark */

:root[data-theme="dark"] .nowcard{--nc-bg:#0F3D2A;--nc-ink:#EEF2EF;--nc-ink2:#A9C4B3;--nc-btn:var(--pop);--nc-btn-ink:var(--on-pop);--nc-line:rgba(255,255,255,.10)}

/* ===== Base ===== */
*{box-sizing:border-box}

.navbar.inline{height:calc(var(--sa) + 44px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--bar-line)}

.band{background:var(--pop);color:var(--on-pop);margin:calc(-1 * (var(--sa) + var(--sp2))) calc(-1 * var(--sp5)) 0;padding:calc(var(--sa) + var(--sp2)) var(--sp5) var(--sp6);border-radius:0 0 28px 28px}

.nowcard .lv .sub{color:var(--nc-ink2)}

.nbtn{flex:none;height:44px;padding:0 var(--sp4);border-radius:var(--r-inner);background:var(--nc-btn);color:var(--nc-btn-ink);font-size:17px;font-weight:600;display:flex;align-items:center;transition:opacity .1s linear}

.dcard:active{background:var(--press)}

.dcard .top{display:flex;justify-content:space-between}

.btn{display:flex;align-items:center;justify-content:center;height:50px;padding:0 var(--sp5);border-radius:var(--r-btn);font-size:17px;font-weight:600;transition:opacity .1s linear}

.b-pri{background:var(--pop);color:var(--on-pop)}
.b-sec{background:var(--pop-tint);color:var(--pop-ink)}
.tbtn{color:var(--brand-ink);min-height:44px}
.tbtn:active{opacity:.5}

/* plan */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);height:36px;padding:2px;border-radius:var(--r-inner);background:var(--track);margin-top:var(--sp3)}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));border-radius:8px;background:var(--thumb);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .2s var(--ease);transform:translateX(calc(100% * var(--i)))}
.seg button{position:relative;z-index:1;font-size:15px;line-height:20px;text-align:center}

.seg i{background:var(--pop)!important;box-shadow:none!important}
.map{margin-top:var(--sp4);height:184px;border-radius:var(--r-card);overflow:hidden;background:var(--pop-tint)}
.map svg{display:block;width:100%;height:100%}
.map .pin{cursor:pointer;outline:none}
.map text{font-family:var(--font);pointer-events:none;font-variant-numeric:tabular-nums}
.mapcap{margin-top:var(--sp2);padding:0 var(--sp4)}
.tl .item{display:grid;grid-template-columns:52px 24px minmax(0,1fr);align-items:start;width:100%;min-height:64px;padding:var(--sp3) var(--sp4) var(--sp3) var(--sp4);position:relative;transition:background-color .1s linear}
button.item:active{background:var(--press)}
.tl .item.cur{background:var(--pop-tint)}
.tl .item .tm{font-size:15px;line-height:20px;font-weight:600;padding-top:1px}
.tl .item .rail{position:relative;align-self:stretch}
.tl .item .rail::before{content:"";position:absolute;left:11px;top:calc(-1 * var(--sp3));bottom:calc(-1 * var(--sp3));border-left:2px solid var(--sep)}
.tl .item.first .rail::before{top:9px}
.tl .item.last .rail::before{bottom:auto;height:9px}
.tl .item .node{position:absolute;left:7px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink3)}
.tl .item.cur .node{background:var(--pop);box-shadow:0 0 0 3px var(--pop-tint),0 0 0 4px var(--pop)}
.tl .item.done .node{background:var(--ink3);box-shadow:none}
.tl .item.done .nm{color:var(--ink2)}
.tl .item .ct>*+*{margin-top:var(--sp1)}
.tl .drive{display:grid;grid-template-columns:52px 24px 1fr;height:28px;align-items:center;padding:0 var(--sp4)}
.tl .drive .rail{position:relative;height:100%}
.tl .drive .rail::before{content:"";position:absolute;left:11px;top:0;bottom:0;border-left:2px dashed var(--sep)}

/* places */
.chips{display:flex;gap:var(--sp2);overflow-x:auto;scrollbar-width:none;margin:var(--sp3) calc(-1 * var(--sp5)) 0;padding:5px var(--sp5)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--sep);font-size:15px;line-height:20px;font-weight:500}
.chips button span{opacity:.6;margin-left:4px}
.chips button[aria-pressed="true"]{background:var(--pop);color:var(--on-pop);box-shadow:none;font-weight:600}

.foot{margin:var(--sp6) var(--sp4) 0}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .26s var(--sheet-ease)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;height:var(--sheet-h,85dvh);background:var(--elevated);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--sheet-shadow);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s var(--sheet-ease)}
.sheet.on{transition-duration:.38s}

<script>
/* ================= DATA (single source of truth) ================= */
const TZ = "+07:00";
const CHECKED = "26 Oct 2026";

/* ================= Clock ================= */
function NOWMS(){ if(window.__SIM) return window.__SIM;
  try{ const q=new URLSearchParams(location.search).get("now"); if(q) return Date.parse(q+TZ);}catch(_){}
  return Date.now(); }
const msOf=(date,t)=>Date.parse(date+"T"+t+":00"+TZ);
const ALL=DAYS.flatMap((d,di)=>d.stops.map(s=>({...s,di,ms:msOf(d.date,s.t)})));
const T0=ALL[0].ms, T1=ALL[ALL.length-1].ms;
const phase=()=>{ const n=NOWMS(); return n<T0?"before":n>=T1?"after":"during"; };
function nowNext(){ const n=NOWMS(); let cur=null,next=null; for(const s of ALL){ if(s.ms<=n) cur=s; else { next=s; break; } } return {cur,next}; }
const bkk=ms=>new Date(ms+7*3600e3);
const todayIdx=()=>DAYS.findIndex(x=>x.date===bkk(NOWMS()).toISOString().slice(0,10));
const hhmm=ms=>bkk(ms).toISOString().slice(11,16);
const hm=h=>String(Math.floor(h)).padStart(2,"0")+":"+String(Math.round((h%1)*60)).padStart(2,"0");
const dur=m=>m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?` ${m%60} min`:""}`;

/* ================= Text helpers ================= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const rating=k=>{ const r=P[k].r; return r?`★ <span class="tn">${r[0].toFixed(1)} (${r[1].toLocaleString("en-US")})</span>`:""; };
function openLine(k){ const p=P[k]; if(!p.o) return ""; const d=bkk(NOWMS()), h=d.getUTCHours()+d.getUTCMinutes()/60, closedDay=(p.cd||[]).includes(d.getUTCDay());
  if(!closedDay&&h>=p.o[0]&&h<p.o[1]) return `<span class="pos">Open until <span class="tn">${hm(p.o[1])}</span></span>`;
  if(!closedDay&&h<p.o[0]) return `<span class="crit">Closed · opens <span class="tn">${hm(p.o[0])}</span></span>`;
  return `<span class="crit">Closed · opens tomorrow</span>`; }
const isOpen=k=>{ const p=P[k]; if(!p.o) return true; const d=bkk(NOWMS()), h=d.getUTCHours()+d.getUTCMinutes()/60; return !(p.cd||[]).includes(d.getUTCDay())&&h>=p.o[0]&&h<p.o[1]; };
const dirUrl=k=>"https://maps.apple.com/?daddr="+P[k].ll.join(",")+"&dirflg=d";

const dayLbl=d=>`${d.dow} ${+d.date.slice(8)} Nov`;
function stopMeta(s){ if(!s.p) return s.d||""; const p=P[s.p]; if(s.p===HOME) return "The Series Resort";
  const named=s.title.includes(p.n.split(" ")[0])||p.n.includes(s.title); return named?p.c:p.n+" · "+p.c; }
const offline=()=>navigator.onLine===false?`<div class="notice" role="status">No signal. The plan is saved on this phone; directions need signal.</div>`:"";

/* ================= State ================= */

/* ================= Scroll, device ================= */
const SC=()=>{ const sc=document.getElementById("screen"); return getComputedStyle(sc).display==="block"?sc:null; };

/* ================= Render ================= */
function go(tab){ S.tab=tab; save(); render(); scroller().scrollTo(0,0); onScroll(); }
function render(){

    `<button class="tab" ${S.tab===k?'aria-current="page"':""} data-tab="${k}"><span>${l}</span></button>`).join("");
}

const header=(title,trail)=>`<header class="lt"><h1 class="largeTitle">${title}</h1>${trail||""}</header>`;

/* ---------- Trip ---------- */
function vTrip(){
  const ph=phase(), n=NOWMS(); let h=`<section class="band"><p class="eyebrow">Mo and Pob's trip</p><h1 class="largeTitle">Khao Yai</h1><p class="subhead ink2 ltsub">Sat 14 – Sun 15 Nov · The Series Resort</p>`;
  if(ph==="before"){ const days=Math.ceil((T0-n)/864e5), f=ALL[0], first=bkk(T0).toISOString().slice(0,10)===bkk(n).toISOString().slice(0,10);
    h+= (T0-n)<864e5
      ? `<div class="count"><span class="n tn">${first?"Today":"Tomorrow"}</span><span class="u tn">${f.t}</span><p class="footnote ink2 l2">Leave Bangkok at ${f.t} · ${LEAVE_HOME}</p></div>`
      : `<div class="count"><span class="n tn">${days}</span><span class="u">days to go</span><p class="footnote ink2 l2">Leave Bangkok Sat ${f.t} · ${LEAVE_HOME}</p></div>`;
  }
  h+=`</section>`+offline();
  if(ph==="during") h+=nowCard();
  if(ph==="after") h=h.replace('</section>'+offline(),`<div class="count"><span class="n">Home</span><p class="footnote ink2 l2">That was the trip. The plan stays here if you want to look back.</p></div></section>`+offline());
  const ti=todayIdx();
  h+=`<div class="sh"><span>Days</span></div><div class="days">${DAYS.map((d,i)=>`<button class="dcard${i===ti?" today":""}" data-day="${i}">
      <span class="top"><span class="footnote ink2">${dayLbl(d)}</span>${i===ti?'<span class="caption1 brand">Today</span>':""}</span>
      <span><span class="title3" style="display:block">Day ${i+1}</span><span class="subhead ink2 tn">${d.stops.length} stops</span></span></button>`).join("")}</div>`;
  const r=P[HOME];
  h+=`<div class="sh"><span>Stay</span></div><div class="group">
    <button class="row" data-place="${HOME}"><span class="tx"><span class="headline" style="display:block">${r.n}</span><span class="subhead ink2" style="display:block">${rating(HOME)} · Booked, breakfast included</span></span></button>
    <div class="row"><span class="tx"><span class="footnote ink2" style="display:block">Check-in</span><span class="headline tn" style="display:block">Sat 15:00</span></span>
      <span class="tx"><span class="footnote ink2" style="display:block">Check-out</span><span class="headline tn" style="display:block">Sun 12:00</span></span></div></div>`;
  h+=`<div class="sh"><span>Good to know</span></div><div class="group">${TIPS.map(([a,b])=>`<div class="row"><span class="tx"><span class="headline" style="display:block">${a}</span><span class="subhead ink2" style="display:block">${b}</span></span></div>`).join("")}</div>`;
  h+=`<p class="footnote ink3 foot">Ratings and hours from Google Maps, checked ${CHECKED}.</p>`;
  return {title:"Khao Yai",html:h};
}
function nowCard(){
  const {cur,next}=nowNext(); const n=NOWMS();
  let h=`<section class="nowcard${next&&next.dr&&next.ms-next.dr*6e4<n?" late":""}" aria-label="Now and up next">`;
  if(cur){ const p=cur.p&&P[cur.p]; h+=`<p class="caption2 eb">Now</p><p class="title2 t${thc(cur.title)}">${T(cur.title)}</p>${p&&p.t?`<p class="subhead th th2" lang="th">${esc(p.t)}</p>`:""}`; }
  if(next){
    const lm=next.dr?next.ms-next.dr*6e4:next.ms, mins=Math.round((lm-n)/6e4);
    const word=next.dr?"Leave by":"Starts";
    const cls=mins<10?"late":mins<=30?"amber":"ontime";
    const lead= mins<0 ? `<span class="headline late">${-mins} min late</span>` : mins<1 ? `<span class="headline late">${next.dr?"Leave now":"Starting now"}</span>` : `<span class="headline ${cls} tn">${word} ${hhmm(lm)}</span> <span class="subhead sub tn">in ${dur(mins)}</span>`;
    h+=`${cur?"<hr>":""}<p class="caption2 eb">Up next</p><p class="headline t${thc(next.title)}">${T(next.title)}</p>
      <div class="lv"><span>${lead}</span>${next.p?`<a class="nbtn" href="${dirUrl(next.p)}" target="_blank" rel="noopener">Directions</a>`:""}</div>`;
  }
  return h+`</section>`;
}

/* ---------- Plan ---------- */
function vPlan(){
  const d=DAYS[S.day], n=NOWMS(), nn=nowNext(), ph=phase(), ti=todayIdx();
  const trail=(ph==="during"&&ti>=0&&ti!==S.day)?`<button class="tbtn" data-sday="${ti}">Today</button>`:"";
  let h=header("Plan",trail)+offline();
  h+=`<div class="seg" role="group" aria-label="Day" style="--n:${DAYS.length};--i:${S.day}"><i aria-hidden="true"></i>${DAYS.map((x,i)=>`<button aria-pressed="${i===S.day}" data-sday="${i}">${x.dow} ${+x.date.slice(8)}</button>`).join("")}</div>`;
  const driving=d.stops.reduce((a,s)=>a+(s.dr||0),0);
  h+=mapSVG(d)+`<p class="footnote ink2 mapcap tn">${d.title} · ${dur(driving)} of driving between stops</p>`;
  h+=`<div class="sh"><span class="tn">${d.stops.length} stops</span></div><div class="group tl">`;
  d.stops.forEach((s0,i)=>{
    const s={...s0,di:S.day,ms:msOf(d.date,s0.t)}, isCur=ph==="during"&&nn.cur&&nn.cur.id===s.id, isNext=ph==="during"&&nn.next&&nn.next.id===s.id, done=s.ms<n&&!isCur;
    if(s.dr) h+=`<div class="drive" aria-hidden="true"><span></span><span class="rail"></span><span class="caption1 ink3">${s.dr} min drive</span></div>`;
    const st=[];
    if(isNext&&s.dr) st.push(`<span class="lpill tn">Leave by ${hhmm(s.ms-s.dr*6e4)}</span>`);
    if(s.bk) st.push(`<span class="stat pos"><span class="dot"></span>Booked</span>`);
    if(s.p&&P[s.p].uv) st.push(`<span class="stat warn"><span class="dot"></span>Check hours</span>`);
    const cls=`item${isCur?" cur":""}${done?" done":""}${i===0?" first":""}${i===d.stops.length-1?" last":""}`;
    const inner=`<span class="tm tn">${s.t}</span><span class="rail"><span class="node"></span></span><span class="ct">
      <span class="headline nm${thc(s.title)}" style="display:block">${T(s.title)}</span>
      <span class="footnote ink2${thc(stopMeta(s))}" style="display:block">${T(stopMeta(s))}</span>${st.length?`<span style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${st.join("")}</span>`:""}</span>`;
    h+= s.p?`<button class="${cls}" id="s-${s.id}" data-stop="${s.id}">${inner}</button>`:`<div class="${cls}" id="s-${s.id}">${inner}</div>`;
  });
  return {title:"Plan",html:h+`</div>`};
}
function mapSVG(d){
  const pts=d.stops.filter(s=>s.p).reduce((a,s)=>{ if(!a.find(x=>x.p===s.p)) a.push({p:s.p,ids:[s.id],first:s.id,n:a.length+1}); else a.find(x=>x.p===s.p).ids.push(s.id); return a; },[]);
  if(pts.length<2) return "";
  const W=350,H=184,pad=26, lat=pts.map(x=>P[x.p].ll[0]), lng=pts.map(x=>P[x.p].ll[1]);
  let a0=Math.min(...lat),a1=Math.max(...lat),o0=Math.min(...lng),o1=Math.max(...lng);
  const k=Math.cos(14.5*Math.PI/180); let sx=(o1-o0)*k||.01, sy=(a1-a0)||.01; const ar=(W-2*pad)/(H-2*pad);
  if(sx/sy>ar){ const e=(sx/ar-sy)/2; a0-=e; a1+=e; sy=a1-a0; } else { const e=(sy*ar-sx)/2/k; o0-=e; o1+=e; sx=(o1-o0)*k; }
  pts.forEach(x=>{ const ll=P[x.p].ll; x.x=x.ox=pad+((ll[1]-o0)*k)/sx*(W-2*pad); x.y=x.oy=pad+(a1-ll[0])/sy*(H-2*pad); });
  for(let it=0;it<80;it++) for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){ const A=pts[i],B=pts[j]; let dx=B.x-A.x,dy=B.y-A.y,dd=Math.hypot(dx,dy);
    if(dd<26){ if(dd<.5){dx=1;dy=0;dd=1} const f=(26-dd)/2; A.x-=dx/dd*f; A.y-=dy/dd*f; B.x+=dx/dd*f; B.y+=dy/dd*f; } }
  pts.forEach(x=>{ x.x=Math.max(16,Math.min(W-16,x.x)); x.y=Math.max(16,Math.min(H-16,x.y)); });
  const css=getComputedStyle(document.documentElement), br=css.getPropertyValue("--pop").trim(), line=css.getPropertyValue("--pop-ink").trim(), sf=css.getPropertyValue("--surface").trim(), i3=css.getPropertyValue("--ink3").trim(), ob=css.getPropertyValue("--on-pop").trim();
  const n=NOWMS(), nn=nowNext(), ph=phase();
  return `<div class="map" role="group" aria-label="Route map, ${pts.length} places"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <polyline points="${pts.map(x=>x.ox.toFixed(1)+","+x.oy.toFixed(1)).join(" ")}" fill="none" stroke="${line}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(x=>{ const cur=ph==="during"&&nn.cur&&x.ids.includes(nn.cur.id), done=!cur&&x.ids.every(id=>ALL.find(a=>a.id===id).ms<n), r=cur?14:11;
      return `<g class="pin" data-jump="${x.first}" role="button" tabindex="0" aria-label="Stop ${x.n}, ${esc(P[x.p].n)}">
      ${Math.hypot(x.x-x.ox,x.y-x.oy)>2?`<line x1="${x.ox}" y1="${x.oy}" x2="${x.x}" y2="${x.y}" stroke="${br}" stroke-width="1"/>`:""}
      <circle cx="${x.x}" cy="${x.y}" r="22" fill="transparent"/><circle cx="${x.x}" cy="${x.y}" r="${r}" fill="${done?i3:br}" stroke="${sf}" stroke-width="2"/>
      <text x="${x.x}" y="${x.y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${x.n}</text></g>`; }).join("")}
  </svg></div>`;
}

/* ---------- Places ---------- */
const inPlan=k=>ALL.find(x=>x.p===k&&k!==HOME);
function vPlaces(){
  const keys=Object.keys(P).filter(k=>P[k].cat!=="stay"&&k!=="checkpoint");
  const pass=k=>(S.cat==="all"||P[k].cat===S.cat)&&(!S.openOnly||isOpen(k));
  const cnt=c=>keys.filter(k=>(c==="all"||P[k].cat===c)&&(!S.openOnly||isOpen(k))).length;
  const list=keys.filter(pass);
  const planned=list.filter(inPlan).sort((a,b)=>inPlan(a).ms-inPlan(b).ms), others=list.filter(k=>!inPlan(k)).sort((a,b)=>P[b].r[0]-P[a].r[0]);
  let h=header("Places")+`<p class="subhead ink2 ltsub">${keys.length} places around Pak Chong</p>`+offline();
  h+=`<div class="chips" role="group" aria-label="Category">${CATS.map(([c,l])=>`<button aria-pressed="${S.cat===c}" data-cat="${c}">${l}<span class="tn">${cnt(c)}</span></button>`).join("")}</div>`;
  h+=`<div class="group toggle"><div class="row" style="min-height:44px"><span class="tx body" id="openlbl">Open now</span><button class="switch" role="switch" aria-checked="${S.openOnly}" aria-labelledby="openlbl" data-toggle="open"></button></div></div>`;
  const row=k=>{ const p=P[k], ip=inPlan(k), meta=[esc(p.c),rating(k)], ol=openLine(k); if(ol) meta.push(ol);
    return `<button class="row" data-place="${k}"><span class="tx"><span class="headline${thc(p.n)}" style="display:block">${T(p.n)}</span>
      <span class="subhead ink2" style="display:block">${meta.join(" · ")}</span>
      <span class="footnote ink2${thc(p.a)}" style="display:block">${ip?`<span class="w600 tn" style="color:var(--pop-ink)">${DAYS[ip.di].dow} ${ip.t}</span> · `:""}${T(p.a)}${p.uv?' · <span class="warn w600">Check hours</span>':""}</span></span></button>`; };
  if(!list.length){ const c=CATS.find(x=>x[0]===S.cat)[1].toLowerCase();
    return {title:"Places",html:h+`<div class="empty"><p class="headline">No ${S.cat==="all"?"places":c} open right now</p><p class="subhead ink2">Most places here close by 18:00.</p><button class="tbtn body" data-toggle="open">Show closed places</button></div>`}; }
  if(planned.length) h+=`<div class="sh" style="margin-top:var(--sp4)"><span>In your plan</span></div><div class="group">${planned.map(row).join("")}</div>`;
  if(others.length) h+=`<div class="sh"><span>Also nearby</span></div><div class="group">${others.map(row).join("")}</div>`;
  return {title:"Places",html:h};
}

/* ---------- Sheet (medium, drag up to large) ---------- */
let lastFocus=null, sheetY=0;
const sheetEl=()=>document.getElementById("sheet");
const sheetH=()=>sheetEl().getBoundingClientRect().height||innerHeight*.85;
const vpH=()=>{ const sc=SC(); return sc?sc.clientHeight:innerHeight; };
const MED=()=>Math.max(0,sheetH()-vpH()*.5);
function setY(y){ sheetY=y; const sh=sheetEl(); sh.style.transform=`translateY(${y}px)`; const f=sh.querySelector(".sfoot"), b=sh.querySelector(".sbody"); if(f) f.style.transform=`translateY(${-y}px)`; if(b) b.style.paddingBottom=`calc(${y}px + 24px)`; }
function openSheet(k,stop){
  lastFocus=document.activeElement;
  const p=P[k], sh=sheetEl(), bg=document.getElementById("scrim"), ip=inPlan(k), src=stop||ip, why=src&&(src.w||src.d);
  const thaiTitle=isTh(p.n);
  sh.innerHTML=`<div class="grabzone" data-grab><div class="grabber"></div></div>
    <div class="sbody">
      <div class="shead"><div><h2 id="shtitle" class="${thaiTitle?"thaiTitle":"title2"}"${thaiTitle?' lang="th"':""}>${esc(p.n)}</h2>${p.t?`<p class="subhead ink2 th" lang="th">${esc(p.t)}</p>`:""}</div>
        <button class="x" data-close aria-label="Close"><span aria-hidden="true">✕</span></button></div>
      <p class="subhead ink2${thc(p.a)}" style="margin-top:var(--sp3)">${esc(p.c)} · ${rating(k)} · ${T(p.a)}</p>
      ${why?`<div class="why"><p class="footnote w600 brand">Why it's in the plan</p><p class="body${thc(why)}">${T(why)}</p></div>`:""}
      <p class="body ink2 desc">${esc(p.d)}</p>
      <div class="group">
        <div class="row"><span class="tx body">Today</span><span class="subhead">${openLine(k)||'<span class="ink2">No set hours</span>'}</span></div>
        <div class="row"><span class="tx body">Hours</span><span class="subhead ink2 tn" style="text-align:right">${esc(p.h||"Not listed")}</span></div>
        ${k!==HOME?`<div class="row"><span class="tx body">In your plan</span><span class="subhead ink2 tn">${ip?`${DAYS[ip.di].dow} ${ip.t}`:"No"}</span></div>`:""}
      </div>
      ${p.uv?`<p class="footnote ink2" style="margin:var(--sp2) var(--sp4) 0">These hours aren't confirmed. Check before you go.</p>`:""}
    </div>
    <div class="sfoot"><a class="btn b-pri" href="${dirUrl(k)}" target="_blank" rel="noopener">Directions</a><a class="btn b-sec" href="${gUrl(k)}" target="_blank" rel="noopener">Google Maps</a></div>`;
  sh.hidden=false; bg.hidden=false; sh.classList.remove("on"); setY(sheetH());
  const sc=SC(); if(sc) sc.classList.add("locked"); else { lockY=scrollY; document.body.style.cssText=`position:fixed;top:-${lockY}px;left:0;right:0`; }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ sh.classList.add("on"); bg.classList.add("on"); setY(MED()); }));
  sh.querySelector(".x").focus({preventScroll:true});
}
let lockY=0;
function closeSheet(){ const sh=sheetEl(), bg=document.getElementById("scrim"); if(sh.hidden) return;
  sh.classList.remove("on"); bg.classList.remove("on"); setY(sheetH());
  setTimeout(()=>{ sh.hidden=true; bg.hidden=true; },270);
  const sc=SC(); if(sc) sc.classList.remove("locked"); else { document.body.style.cssText=""; window.scrollTo(0,lockY); }
  if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true}); }
(()=>{ const sh=sheetEl(); let y0=null,start=0,moved=0;
  sh.addEventListener("pointerdown",e=>{ const body=sh.querySelector(".sbody"); const onGrab=!!e.target.closest("[data-grab]");
    if(!onGrab&&!(body&&body.scrollTop<=0&&sheetY>0)) return; if(e.target.closest("a,button")) return;
    y0=e.clientY; start=sheetY; moved=0; sh.classList.add("drag"); sh.setPointerCapture(e.pointerId); });
  sh.addEventListener("pointermove",e=>{ if(y0==null) return; moved=e.clientY-y0; setY(Math.max(0,start+moved)); });
  const end=()=>{ if(y0==null) return; y0=null; sh.classList.remove("drag"); const m=MED();
    if(sheetY>m+80) return closeSheet(); setY(moved<-40||sheetY<m/2?0:m); };
  sh.addEventListener("pointerup",end); sh.addEventListener("pointercancel",end); })();

/* ================= Events ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-day],[data-sday],[data-stop],[data-jump],[data-cat],[data-place],[data-toggle],[data-close],#scrim"); if(!t) return;
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.day){ S.day=+t.dataset.day; return go("plan"); }
  if(t.dataset.sday){ S.day=+t.dataset.sday; save(); return render(); }
  if(t.dataset.jump){ const el=document.getElementById("s-"+t.dataset.jump); if(el){ const sc=SC(); const y=el.getBoundingClientRect().top-(sc?sc.getBoundingClientRect().top:0)+scrollPos()-120; scroller().scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"}); } return; }
  if(t.dataset.stop){ const s=ALL.find(x=>x.id===t.dataset.stop); if(s&&s.p) openSheet(s.p,s); return; }
  if(t.dataset.cat){ S.cat=t.dataset.cat; save(); return render(); }
  if(t.dataset.toggle){ S.openOnly=!S.openOnly; save(); return render(); }
  if(t.dataset.place) return openSheet(t.dataset.place);
  if(t.hasAttribute("data-close")||t.id==="scrim") return closeSheet();
});
addEventListener("online",render); addEventListener("offline",render);
document.addEventListener("keydown",e=>{ const sh=sheetEl();
  if(e.key==="Escape") closeSheet();
  if(e.key==="Tab"&&!sh.hidden){ const f=[...sh.querySelectorAll("a,button")], a=f[0], z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()} else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()} }
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("pin")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); } });
setInterval(()=>{ if(!window.__SIM&&document.visibilityState==="visible"&&sheetEl().hidden&&phase()==="during") render(); },15000);
setInterval(()=>{ if(!window.__SIM&&document.visibilityState==="visible"&&sheetEl().hidden&&phase()!=="during") render(); },60000);
render(); onScroll();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script></body></html>
